# ------------------------------------------------------------------
# debian-kernel-builder config
# Edit these values, then run ./build.sh - no prompts, no wizard.
# ------------------------------------------------------------------

# Exact kernel version to build. This must be a real plain upstream
# release at kernel.org (https://kernel.org) - stage 1 always downloads
# the vanilla kernel.org tarball, never CachyOS's own pre-patched tree
# (see README), so this is NOT a CachyOS release tag.
# Example: 7.2.2
kernel_version="7.2.2"

# CPU optimization target.
#   generic  -> safe x86-64-v3 baseline, boots on any modern 64-bit CPU
#   native   -> tuned for the machine actually running the build (not portable)
#   <name>   -> a specific microarch: rocketlake, alderlake, tigerlake,
#               icelake, skylake, znver3, znver4, znver5, etc.
#               (passed straight through as a compiler -march= value, not
#               a Kconfig option - see README)
cpu="generic"

# CPU scheduler.
#   cfs    -> kernel's own CFS (only valid on kernel_version < 6.6)
#   eevdf  -> kernel's own EEVDF, the default since 6.6 (no patch needed)
#   bore   -> Burst-Oriented Response Enhancer (patched in)
#   pds    -> Priority and Deadline based Skip list scheduler (patched in)
#   bmq    -> BitMap Queue scheduler (patched in)
scheduler="eevdf"

# Parallel build jobs. Leave empty to use every core (nproc).
jobs=""

# Suffix appended to the kernel package version, e.g. -pikaos, -custom.
localversion="-custom"

# Timer tick rate (CONFIG_HZ). Higher = finer scheduling granularity and
# better desktop responsiveness, at the cost of more timer interrupts;
# lower favors server throughput/power. One of: 100, 250, 300, 1000.
# 250 is the kernel's own upstream default.
hz="250"

# Preemption model.
#   lazy -> CONFIG_PREEMPT_LAZY, scheduler-controlled preemption - the
#           kernel's own default on current x86_64 kernels, a balanced
#           middle ground
#   full -> CONFIG_PREEMPT, always preemptible - lowest latency, small
#           throughput cost; what desktop/low-latency setups want
# The older PREEMPT_NONE ("server")/PREEMPT_VOLUNTARY ("desktop") names
# aren't selectable at all on current x86_64 kernels - see
# kernel/Kconfig.preempt (PREEMPT_VOLUNTARY depends on
# !ARCH_HAS_PREEMPT_LAZY, which x86_64 always selects). 04-configure.sh
# verifies the chosen model actually stuck rather than silently falling
# back to a default.
preempt="lazy"

# Trim the module list to only what's currently loaded on THIS machine
# (make localmodconfig against `lsmod`), cutting compile time a lot.
# Only sensible if you're building on the exact machine that will run
# the kernel - it can drop drivers for hardware that isn't attached or
# active right now (a USB device you don't have plugged in, a second
# GPU, etc). yes/no, default no.
trim_modules="no"

# Verify the downloaded tarball against kernel.org's own PGP signature
# before it's extracted and built into a root-owned kernel. Requires gpg
# and, once, network access to a keyserver to import the release keys.
verify_signature="yes"
